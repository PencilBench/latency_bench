[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latency-bench"
version = "0.1.0"
description = "Moonlight 客户端硬件解码延迟测量工具（PyAV + D3D11VA / VideoToolbox）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "av>=19,<20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
latency-bench = "latency_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/latency_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
